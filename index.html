<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="description" content="The latest announcements and updates from your campus.">
    <title>Campus Notices</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Campus Notices home">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>Campus<span class="brand-light">Notices</span></span>
      </a>
      <span class="topbar-label">STUDENT PORTAL</span>
    </header>

    <main class="page">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">YOUR CAMPUS, IN THE KNOW</p>
        <h1 id="page-title">The notice board<span class="title-dot">.</span></h1>
        <p class="intro-copy">A little heads-up about everything happening around campus.</p>
      </section>

      <section class="notice-section" aria-label="Campus notices">
        <div class="section-heading">
          <div>
            <h2>Latest updates</h2>
            <p id="result-count" class="result-count" aria-live="polite"></p>
          </div>
          <div class="filters">
            <label class="sr-only" for="category-filter">Filter by category</label>
            <select id="category-filter">
              <option value="all">All notices</option>
              <option value="Academic">Academic</option>
              <option value="Events">Events</option>
              <option value="Facilities">Facilities</option>
              <option value="Students">Students</option>
            </select>
            <label class="search">
              <span class="sr-only">Search notices</span>
              <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
                <circle cx="8.8" cy="8.8" r="5.8" stroke="currentColor" stroke-width="1.6"/>
                <path d="m13.2 13.2 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <input id="notice-search" type="search" placeholder="Search notices">
            </label>
          </div>
        </div>
        <div id="notice-list" class="notice-list"></div>
        <p id="empty-state" class="empty-state" hidden>No notices match your search. Try another keyword or category.</p>
      </section>
    </main>

    <footer class="footer">Have an announcement? <a href="mailto:notices@campus.example">Contact the student office</a></footer>
  </body>
</html>
